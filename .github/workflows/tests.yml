name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cpp:
    name: C++ / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    env:
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pybind11 to build; numpy + matplotlib for the end-to-end test
      - name: Install Python packages
        run: python -m pip install pybind11 numpy matplotlib

      - name: Configure
        run: cmake -B build -DPython_EXECUTABLE="$(which python)"

      - name: Build
        run: cmake --build build --parallel

      - name: C++ tests + end-to-end
        run: ctest --test-dir build --output-on-failure

  python:
    name: Python / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: python -m pip install pybind11 numpy matplotlib pytest

      - name: Configure
        run: cmake -B build -DBUILD_TESTS=OFF -DPython_EXECUTABLE="$(which python)"

      - name: Build Python module
        run: cmake --build build --parallel --target mandelbrot_python

      - name: Python tests
        run: pytest -v
